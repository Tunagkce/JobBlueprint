# Enable with SPRING_PROFILES_ACTIVE=prod. The platform should terminate HTTPS
# and provide these values through its environment/secret settings.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:verify-full}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
# Prefer a dedicated migration role with schema DDL privileges. The application
# role should only have the DML privileges needed to run the app.
spring.flyway.url=${MIGRATION_DB_URL:${DB_URL}}
spring.flyway.user=${MIGRATION_DB_USERNAME:${DB_USERNAME}}
spring.flyway.password=${MIGRATION_DB_PASSWORD:${DB_PASSWORD}}
