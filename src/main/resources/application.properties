spring.application.name=job-tracker
server.address=127.0.0.1

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Local development may adopt the existing Hibernate-created schema at version 1.
# Production explicitly disables automatic baselining.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Set these as environment variables in your IDE run configuration.
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.oauth.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
app.oauth.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}

# Flyway owns schema changes; Hibernate checks mappings at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
